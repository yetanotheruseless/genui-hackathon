[project]
name = "agent_core"
version = "0.1.0"
description = "Shared agent loop + mock physics-research tools, surfaced over multiple generative-UI protocols."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.55.0",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_core"]
