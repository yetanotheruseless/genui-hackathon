[project]
name = "agent_core_mcp"
version = "0.1.0"
description = "Agent_core tools exposed as a stdio MCP server (for Goose, Claude Desktop, VS Code, etc)."
requires-python = ">=3.11"
dependencies = [
    "agent_core",
    "mcp>=1.13",
]

[project.scripts]
agent-core-mcp = "agent_core_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_core_mcp"]
