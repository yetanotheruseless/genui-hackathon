[project]
name = "agui_backend"
version = "0.1.0"
description = "AG-UI protocol adapter over agent_core."
requires-python = ">=3.11"
dependencies = [
    "agent_core",
    "ag-ui-protocol>=0.1.18",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agui_backend"]
