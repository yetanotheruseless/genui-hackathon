<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dungeon · Viewport</title>
    <style>
      :root { color-scheme: dark; --bg:#08080d; --panel:#11121a; --line:#2a2d3c; --ink:#c9d2e3; --dim:#6f7689; --accent:#6ee7ff; }
      * { box-sizing: border-box; }
      html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
      body { display:flex; flex-direction:column; }
      .strip { display:flex; gap:12px; padding:5px 8px; border-bottom:1px solid var(--line); align-items:center; }
      .strip .badge { color:var(--dim); }
      .strip .val { color:var(--ink); }
      .strip .accent { color:var(--accent); }
      #wrap { flex:1; position:relative; min-height:0; }
      canvas { display:block; width:100%; height:100%; }
      #compass { position:absolute; top:6px; right:6px; font-size:11px; color:var(--dim); background:rgba(8,8,13,.55); padding:3px 6px; border-radius:3px; }
      #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; transition:opacity .25s; }
      #overlay.hidden { opacity:0; }
      #overlay span { background:rgba(8,8,13,.7); padding:8px 16px; border:1px solid var(--line); border-radius:4px; color:var(--accent); }
    </style>
  </head>
  <body>
    <div class="strip">
      <span class="badge">viewport</span>
      <span class="val" id="hud-theme">—</span>
      <span class="badge">·</span>
      <span class="val" id="hud-pos">(0,0)</span>
      <span class="badge">·</span>
      <span class="val" id="hud-hp">12/12</span>
      <span class="badge" style="margin-left:auto" id="hud-llm">llm:?</span>
    </div>
    <div id="wrap">
      <canvas id="canvas"></canvas>
      <div id="compass">N ↑</div>
      <div id="overlay"><span>click to play · WASD to move · ←/→ to turn</span></div>
    </div>
    <script type="module" src="/src/viewport-main.ts"></script>
  </body>
</html>
