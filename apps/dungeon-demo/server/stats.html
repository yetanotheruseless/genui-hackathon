<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dungeon · Stats</title>
    <style>
      :root { color-scheme: dark; --bg:#08080d; --line:#2a2d3c; --ink:#c9d2e3; --dim:#6f7689; --accent:#6ee7ff; }
      * { box-sizing: border-box; }
      html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
      body { display:flex; flex-direction:column; }
      header { padding:5px 8px; border-bottom:1px solid var(--line); color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.12em; }
      header span#status { float:right; color:var(--ink); text-transform:none; letter-spacing:0; }
      #body { flex:1; overflow-y:auto; padding:8px 10px; }
      .row { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dotted var(--line); }
      .row dt { color:var(--dim); margin:0; }
      .row dd { color:var(--ink); margin:0; }
      h3 { font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:var(--dim); margin: 14px 0 6px; }
      ul { list-style: none; margin:0; padding:0; }
      ul li { padding:3px 5px; border:1px solid var(--line); border-radius:3px; margin-bottom:3px; }
      ul li .kind { color:var(--accent); }
      .empty { color:var(--dim); border:0; }
      .hp-bar { width:100%; height:8px; background:#1a1c28; border-radius:3px; overflow:hidden; margin-top:3px; }
      .hp-bar > span { display:block; height:100%; background:linear-gradient(90deg, #f08c87, #ffb86b); }
    </style>
  </head>
  <body>
    <header>stats &amp; inventory <span id="status">connecting…</span></header>
    <div id="body">
      <h3>Vitals</h3>
      <dl>
        <div class="row"><dt>HP</dt><dd id="stat-hp">—</dd></div>
        <div class="row"><dt>Steps</dt><dd id="stat-steps">0</dd></div>
        <div class="row"><dt>Position</dt><dd id="stat-pos">—</dd></div>
        <div class="row"><dt>Chunk theme</dt><dd id="stat-theme">—</dd></div>
        <div class="row"><dt>Loaded chunks</dt><dd id="stat-chunks">0</dd></div>
      </dl>
      <div class="hp-bar"><span id="hp-bar-fill"></span></div>
      <h3>Inventory</h3>
      <ul id="inv-list"><li class="empty">— empty —</li></ul>
      <h3>Nearby</h3>
      <ul id="nearby-list"><li class="empty">—</li></ul>
    </div>
    <script type="module" src="/src/stats-main.ts"></script>
  </body>
</html>
