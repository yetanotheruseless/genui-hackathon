<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dungeon · Narration</title>
    <style>
      :root { color-scheme: dark; --bg:#08080d; --line:#2a2d3c; --ink:#c9d2e3; --dim:#6f7689; --accent:#6ee7ff; }
      * { box-sizing: border-box; }
      html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
      body { display:flex; flex-direction:column; }
      header { padding:5px 8px; border-bottom:1px solid var(--line); color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.12em; }
      header span#status { float:right; color:var(--ink); text-transform:none; letter-spacing:0; }
      #log { flex:1; overflow-y:auto; padding:8px 10px; }
      #log .line { margin-bottom:6px; line-height:1.4; }
      #log .voice { color: var(--accent); font-weight:600; margin-right:4px; }
      #log .voice.Wren  { color:#8ee089; }
      #log .voice.Brokk { color:#f08c87; }
      #log .voice.Lyra  { color:#c896ff; }
      #log .ts { color: var(--dim); font-size:10px; margin-left:6px; }
    </style>
  </head>
  <body>
    <header>narration <span id="status">connecting…</span></header>
    <div id="log"></div>
    <script type="module" src="/src/narration-main.ts"></script>
  </body>
</html>
