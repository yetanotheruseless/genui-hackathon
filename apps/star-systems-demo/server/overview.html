<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Starship · Overview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #04060a;
        --line: #202a3d;
        --line-strong: #2a3a55;
        --ink: #cfd6e6;
        --dim: #6f7689;
        --accent: #7ad7ff;
        --star: #ffd28a;
        --planet: #6ba2e0;
        --orbital: #9c6cff;
        --ship: #88ffd9;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: var(--bg); color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
      }
      body { display: flex; flex-direction: column; }

      header {
        padding: 5px 8px;
        border-bottom: 1px solid var(--line);
        color: var(--dim);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        display: flex;
        gap: 6px;
        align-items: center;
        flex-shrink: 0;
      }
      header .ship {
        color: var(--star);
        font-style: italic;
        font-weight: 600;
        text-transform: none;
        letter-spacing: 0;
      }
      header .right {
        margin-left: auto;
        color: var(--ink);
        text-transform: none;
        letter-spacing: 0;
      }

      /* Filter row — Eve-style chip buttons that toggle which categories appear. */
      #filters {
        display: flex;
        gap: 4px;
        padding: 5px 8px;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      .chip {
        background: transparent;
        color: var(--dim);
        border: 1px solid var(--line);
        padding: 3px 8px;
        border-radius: 3px;
        cursor: pointer;
        font: inherit;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .chip:hover { color: var(--ink); border-color: var(--line-strong); }
      .chip.active {
        background: rgba(122, 215, 255, 0.08);
        color: var(--accent);
        border-color: var(--accent);
      }

      /* Table — sticky header, scrollable body. */
      .table-wrap {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
        table-layout: fixed;
      }
      /* Fixed column widths. Distance gets a generous fixed allocation
         so values like "0.0 l-min" and "31.8 AU" never truncate; name +
         type + parent share what's left. icon is a small fixed column. */
      thead th:nth-child(1), tbody td:nth-child(1) { width: 18px; padding-left: 6px; padding-right: 0; }
      thead th:nth-child(2), tbody td:nth-child(2) { width: auto; }
      thead th:nth-child(3), tbody td:nth-child(3) { width: 28%; }
      thead th:nth-child(4), tbody td:nth-child(4) { width: 22%; }
      thead th:nth-child(5), tbody td:nth-child(5) { width: 76px; padding-right: 8px; }
      thead th {
        position: sticky;
        top: 0;
        background: var(--bg);
        text-align: left;
        font-weight: 600;
        color: var(--dim);
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 5px 8px;
        border-bottom: 1px solid var(--line-strong);
        cursor: pointer;
        user-select: none;
      }
      thead th:hover { color: var(--ink); }
      thead th.sort-active { color: var(--accent); }
      thead th.sort-active::after { content: " ▾"; font-size: 8px; }
      thead th.sort-active.asc::after { content: " ▴"; }

      tbody tr {
        border-bottom: 1px dotted var(--line);
        cursor: pointer;
      }
      tbody tr:hover { background: rgba(122, 215, 255, 0.04); }
      /* Expand/collapse caret on star rows that have planets. Tighter
         hit target than the whole row so the row's normal target
         click still works on the rest of the cell.
         vertical-align:middle + line-height pins the +/− glyph to the
         row's middle so it doesn't visually intrude on the header
         bar above when the first row sits near the top of the table. */
      .caret {
        display: inline-block;
        width: 1em;
        margin-right: 4px;
        opacity: 0.6;
        cursor: pointer;
        user-select: none;
        vertical-align: middle;
        line-height: 1;
        font-size: 11px;
      }
      .caret:hover { opacity: 1; color: var(--accent); }
      /* A few extra pixels of breathing room between the OVERVIEW
         header bar and the first row, so the caret doesn't appear to
         intrude into the header. */
      tbody tr:first-child td { padding-top: 4px; }
      /* Planet rows nested under their parent star — visual indent
         via left-padding only. Applied (in render()) only on the ALL
         filter where the hierarchy is meaningful; PLANETS filter
         shows them flat. */
      tbody tr.indent td.name { padding-left: 20px; }

      /* Locked-target row: stronger amber fill + bordered corner
         brackets reminiscent of the empty-state framing. The td.icon
         and td.dist (first/last visible columns) carry the bracket
         halves so the corners land at the visual row edges. */
      tbody tr.target {
        background: rgba(255, 210, 138, 0.14);
        outline: 1px solid rgba(255, 210, 138, 0.32);
        outline-offset: -1px;
      }
      tbody tr.target td.name {
        color: var(--star);
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      tbody tr.target td.icon { position: relative; }
      tbody tr.target td.dist { position: relative; }
      /* Corner-bracket halves on the row's first + last cells. Two
         pseudo-elements per side gives all 4 corners. Shorter than
         half the row height so top + bottom brackets stay visibly
         separated, and thin enough not to crowd the icon column. */
      tbody tr.target td.icon::before,
      tbody tr.target td.icon::after,
      tbody tr.target td.dist::before,
      tbody tr.target td.dist::after {
        content: "";
        position: absolute;
        width: 5px;
        height: 5px;
        border-color: var(--star);
        border-style: solid;
        border-width: 0;
        pointer-events: none;
      }
      tbody tr.target td.icon::before { top: 1px;    left: 1px;    border-top-width:    1px; border-left-width:  1px; }
      tbody tr.target td.icon::after  { bottom: 1px; left: 1px;    border-bottom-width: 1px; border-left-width:  1px; }
      tbody tr.target td.dist::before { top: 1px;    right: 1px;   border-top-width:    1px; border-right-width: 1px; }
      tbody tr.target td.dist::after  { bottom: 1px; right: 1px;   border-bottom-width: 1px; border-right-width: 1px; }
      tbody td {
        padding: 4px 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      tbody td.icon { width: 16px; padding-right: 0; font-size: 12px; text-align: center; }
      tbody td.name { color: var(--ink); font-weight: 600; }
      tbody td.kind { color: var(--dim); }
      tbody td.dist { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
      tbody td.parent { color: var(--dim); font-style: italic; }

      /* Type-specific row tints */
      tr.kind-star td.icon { color: var(--star); }
      tr.kind-planet td.icon { color: var(--planet); }
      tr.kind-orbital td.icon { color: var(--orbital); }
      tr.kind-ship td.icon { color: var(--ship); }

      .empty-row {
        padding: 24px 8px;
        text-align: center;
        color: var(--dim);
        font-style: italic;
      }

      /* Right-click context menu — Target / Align / Warp. Hidden until
         contextmenu fires; positioned at the cursor; dismissed on any
         click outside or scroll. */
      #ctx-menu {
        position: fixed;
        display: none;
        z-index: 100;
        min-width: 110px;
        background: rgba(4, 6, 10, 0.95);
        border: 1px solid var(--accent);
        border-radius: 4px;
        padding: 4px 0;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      }
      #ctx-menu button {
        display: block;
        width: 100%;
        text-align: left;
        background: transparent;
        color: var(--ink);
        border: none;
        padding: 5px 12px;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      #ctx-menu button:hover:not(:disabled) {
        background: rgba(122, 215, 255, 0.12);
        color: var(--accent);
      }
      #ctx-menu button:disabled {
        color: var(--dim);
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <header>
      OVERVIEW · <span class="ship" id="ship-name">—</span>
      <span class="right" id="hud-pos">—</span>
    </header>

    <div id="filters">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="star">Stars</button>
      <button class="chip" data-filter="planet">Planets</button>
      <button class="chip" data-filter="orbital">Orbitals</button>
      <button class="chip" data-filter="ship">Ships</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="icon"></th>
            <th data-sort="name">Name</th>
            <th data-sort="kind">Type</th>
            <th data-sort="parent">Parent</th>
            <th data-sort="distance" class="sort-active asc" style="text-align:right">Distance</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div id="ctx-menu">
      <button data-action="target">Target</button>
      <button data-action="align">Align</button>
      <button data-action="warp">Warp</button>
    </div>

    <script type="module" src="/src/overview-main.ts"></script>
  </body>
</html>
