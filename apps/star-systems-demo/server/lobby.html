<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Starship · Lobby</title>
    <style>
      :root { color-scheme: dark; --bg:#04060a; --line:#202a3d; --ink:#cfd6e6; --dim:#6f7689; --accent:#7ad7ff; --mind:#ffd28a; --orbital:#9c6cff; --other:#88ffd9; }
      * { box-sizing: border-box; }
      html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13px; }
      body { display:flex; flex-direction:column; align-items:stretch; }
      header { padding:10px 16px; border-bottom:1px solid var(--line); color:var(--dim); text-transform:uppercase; letter-spacing:.18em; font-size:11px; }
      header b { color: var(--mind); font-weight: 600; letter-spacing: 0; text-transform: none; }
      main { flex:1; overflow-y:auto; padding:14px 18px; max-width:760px; width:100%; margin:0 auto; }
      h2 { font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--dim); margin: 18px 0 8px; }
      h2:first-of-type { margin-top: 0; }
      input, select, textarea, button { font: inherit; color: var(--ink); }
      input[type="search"], input[type="text"], select {
        background:#0a1422; border:1px solid var(--line); padding:6px 8px; border-radius:4px;
      }
      input[type="search"] { width: 100%; }
      button { background:#1a2436; color:var(--accent); border:1px solid var(--accent); padding:5px 12px; border-radius:4px; cursor:pointer; }
      button:disabled { opacity: 0.4; cursor: default; }

      ul { list-style:none; margin:0; padding:0; }
      .galaxy {
        padding: 9px 10px; border:1px solid var(--line); border-radius:4px;
        margin-bottom:6px; cursor:pointer; transition: border-color 80ms;
      }
      .galaxy:hover { border-color: var(--accent); }
      .galaxy.selected { border-color: var(--accent); background: rgba(122, 215, 255, 0.06); }
      .galaxy .row1 { display:flex; gap:10px; align-items:baseline; }
      .galaxy .gid { color: var(--accent); font-weight: 600; word-break: break-all; }
      .galaxy .meta { color: var(--dim); margin-left:auto; font-size: 11px; white-space: nowrap; }
      .galaxy .ships { color: var(--mind); font-size: 11px; margin-top: 4px; opacity: 0.85; }
      .galaxy .empty { color: var(--dim); font-style: italic; }

      .new-game { border:1px dashed var(--line); border-radius:4px; padding:10px 12px; }
      .new-game .row { display:flex; gap:10px; align-items:center; margin-bottom: 8px; }
      .new-game .row label { color: var(--dim); width: 90px; flex: 0 0 auto; }
      .new-game .row > * + * { flex: 1; }
      .new-game select { width: 100%; }
      .mind-tagline { color: var(--dim); font-size: 11px; margin-top: -4px; padding-left: 100px; }
      .actions { display:flex; gap:10px; margin-top: 10px; }
      .primary { color: var(--mind); border-color: var(--mind); }
      .status { color: var(--dim); font-size: 11px; margin-top: 8px; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <header><b>Culture · Contact</b> &nbsp;·&nbsp; lobby</header>
    <main>
      <h2>Existing galaxies</h2>
      <input type="search" id="search" placeholder="filter by gameId, ship name, or Mind…" autocomplete="off" />
      <ul id="games" style="margin-top:8px"></ul>

      <h2>Start (or join) a game</h2>
      <div class="new-game">
        <div class="row">
          <label for="game-id">gameId</label>
          <input type="text" id="game-id" placeholder="leave blank for a new private galaxy" />
        </div>
        <div class="row">
          <label for="ship-class">ship class</label>
          <select id="ship-class"></select>
        </div>
        <div class="row">
          <label for="mind-id">Mind</label>
          <select id="mind-id"></select>
        </div>
        <div class="mind-tagline" id="mind-tagline"></div>
        <div class="actions">
          <button id="join-btn" class="primary">join / launch</button>
          <button id="refresh-btn">refresh list</button>
        </div>
        <div class="status" id="status">loading…</div>
      </div>
    </main>
    <script type="module" src="/src/lobby-main.ts"></script>
  </body>
</html>
