<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GCU Bridge · Mind comm</title>
    <style>
      :root { color-scheme: dark; --bg:#040814; --line:#1f2a3f; --ink:#cfd6e6; --dim:#7a8499; --accent:#7ad7ff; --mind:#ffd28a; --you:#cfd6e6; --sys:#6f7689; }
      * { box-sizing: border-box; }
      html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink); font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; font-size:13px; }
      body { display:flex; flex-direction:column; }
      header {
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: baseline;
        gap: 8px;
        background: linear-gradient(180deg, #08111f 0%, #040814 100%);
      }
      header .label { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .15em; font-family: ui-monospace, monospace; }
      header .ship-name { color: var(--mind); font-weight: 600; font-style: italic; }
      header .tagline { color: var(--dim); font-size: 11px; margin-left: auto; font-family: ui-monospace, monospace; }

      #log { flex: 1; overflow-y: auto; padding: 12px 14px; }
      .turn { margin-bottom: 14px; max-width: 92%; line-height: 1.5; }
      .turn.user { margin-left: auto; background: #112236; padding: 6px 10px; border-radius: 8px 8px 2px 8px; max-width: 75%; }
      .turn.user .voice { color: var(--accent); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; font-family: ui-monospace, monospace; margin-bottom: 2px; }
      .turn.mind_chat { padding-left: 14px; border-left: 2px solid var(--mind); }
      .turn.mind_chat .voice { color: var(--mind); font-style: italic; font-weight: 600; margin-bottom: 3px; font-size: 12px; font-family: ui-monospace, monospace; }
      .turn.mind_narrate { padding-left: 14px; border-left: 2px solid #6ee7ff; opacity: 0.92; }
      .turn.mind_narrate .voice { color: #6ee7ff; font-style: italic; margin-bottom: 3px; font-size: 12px; font-family: ui-monospace, monospace; }
      .turn.system { color: var(--sys); font-size: 11px; font-family: ui-monospace, monospace; opacity: 0.75; padding-left: 14px; border-left: 1px dashed var(--line); }
      .turn .text { white-space: pre-wrap; }

      footer {
        border-top: 1px solid var(--line);
        padding: 8px 10px;
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      textarea {
        flex: 1;
        background: #0a1422;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--ink);
        padding: 8px 10px;
        font: inherit;
        resize: none;
        min-height: 36px;
        max-height: 120px;
        line-height: 1.4;
      }
      textarea:focus { outline: none; border-color: var(--accent); }
      button#send {
        background: linear-gradient(180deg, #1f3a55, #0f2336);
        color: var(--accent);
        border: 1px solid var(--accent);
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        letter-spacing: .05em;
      }
      button#send:hover:not(:disabled) { background: linear-gradient(180deg, #2a4868, #142c44); }
      button#send:disabled { opacity: .5; cursor: progress; }

      .typing { color: var(--dim); font-size: 11px; padding: 4px 12px; font-style: italic; }
      .typing.hidden { display: none; }

      /* Docked-aboard banner — only visible when player.dockedOrbitalId is set.
         Sits between header and log; shows builder + description as a quoted
         note. Color shifts from the bridge's mind-amber palette to a violet
         that matches the orbital marker. */
      #docked-banner {
        display: none;
        margin: 6px 10px 0;
        padding: 8px 10px;
        border: 1px solid #9c6cff;
        border-radius: 6px;
        background: linear-gradient(180deg, rgba(156, 108, 255, 0.10), rgba(156, 108, 255, 0.02));
      }
      #docked-banner.visible { display: block; }
      #docked-banner .title {
        font-family: ui-monospace, monospace;
        color: #c4a3ff;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .12em;
        margin-bottom: 2px;
      }
      #docked-banner .name { color: #ffffff; font-weight: 600; }
      #docked-banner .builder { color: var(--dim); font-size: 11px; margin-left: 6px; font-family: ui-monospace, monospace; }
      #docked-banner .desc {
        margin-top: 6px;
        white-space: pre-wrap;
        line-height: 1.5;
        color: var(--ink);
        font-size: 12px;
        border-left: 2px solid #9c6cff;
        padding-left: 10px;
      }
      #docked-banner .desc.empty { color: var(--dim); font-style: italic; border-left-color: var(--line); }
      #docked-banner .occupants { color: var(--mind); font-size: 11px; margin-top: 6px; font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <header>
      <span class="label">GCU bridge</span>
      <span class="ship-name" id="ship-name">—</span>
      <span class="label">·</span>
      <span style="color: var(--dim); font-family: ui-monospace, monospace; font-size:11px" id="ship-class">—</span>
      <span class="tagline" id="tagline">—</span>
    </header>
    <div id="docked-banner">
      <div class="title">aboard orbital <span class="name" id="docked-name">—</span><span class="builder" id="docked-builder"></span></div>
      <div class="desc empty" id="docked-desc">— builder left no notes —</div>
      <div class="occupants" id="docked-occupants"></div>
    </div>
    <div id="log"></div>
    <div class="typing hidden" id="typing">the Mind is thinking…</div>
    <footer>
      <textarea id="input" placeholder="speak with the Mind…  (cmd/ctrl+enter to send)"></textarea>
      <button id="send" disabled>send</button>
    </footer>
    <script type="module" src="/src/bridge-main.ts"></script>
  </body>
</html>
